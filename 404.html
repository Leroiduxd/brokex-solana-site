<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in Space - BROKEX PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Isolated Styles for 404 Layout with WebGL Shader Canvas -->
    <style>
        html {
            background-color: #060606; /* Solid deep charcoal base behind the canvas */
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: block;
            filter: brightness(1.15) contrast(1.2); /* Dynamic golden rays visibility */
        }

        /* Make primary containers transparent so the shader is visible */
        body {
            background: transparent !important;
            background-color: transparent !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("noise.png");
            opacity: 0.08;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 9999;
        }

        /* 404 Header Area */
        .error-header {
            padding: 30px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 1px solid var(--grid-color);
        }

        .error-header .logo svg {
            height: 30px;
            width: auto;
        }

        /* 404 Center content container */
        .error-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .error-content {
            max-width: 600px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .error-code {
            font-family: 'Source Code Pro', monospace;
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            margin: 0;
            color: var(--gold);
            letter-spacing: -4px;
            text-shadow: 0 0 50px rgba(200, 169, 126, 0.15);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        .error-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            color: var(--text-dark);
        }

        .error-message {
            font-size: 0.95rem;
            color: var(--text-grey);
            max-width: 400px;
            line-height: 1.6;
            margin: 0 0 10px 0;
        }

        /* 404 Floating Coin Graphics */
        .gold-box-404 {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px auto 25px auto;
            transform: translate3d(0,0,0);
        }

        .gold-box-404 .gold-box-asset {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
        }

        .gold-box-404 .asset-base {
            z-index: 11;
            animation: float-base-404 6s infinite ease-in-out;
        }

        .gold-box-404 .asset-overlay {
            z-index: 12;
            animation: float-overlay-404 6s infinite ease-in-out;
            mix-blend-mode: normal;
        }

        .btn-back-home {
            height: 48px !important;
            padding: 0 35px !important;
            font-size: 0.75rem !important;
            letter-spacing: 2px !important;
            font-weight: 800 !important;
            border-radius: 4px !important;
            background-color: var(--gold) !important;
            color: #111 !important;
            border: 1px solid var(--gold) !important;
            text-decoration: none;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            cursor: pointer;
        }

        .btn-back-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(200, 169, 126, 0.15);
            background-color: #ffffff !important;
            border-color: #ffffff !important;
        }

        /* Footer Ticker strip */
        .error-footer {
            height: 50px;
            background: #000000 !important;
            border-top: 1px solid var(--grid-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
            font-family: 'Source Code Pro', monospace;
            font-size: 0.65rem;
            color: var(--text-grey);
            letter-spacing: 1px;
        }

        /* 404 Float Animations */
        @keyframes float-base-404 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes float-overlay-404 {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-25px) rotate(-3deg) scale(1.03); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.9; text-shadow: 0 0 50px rgba(200, 169, 126, 0.15); }
            50% { opacity: 1; text-shadow: 0 0 80px rgba(200, 169, 126, 0.35); }
        }

        /* Mobile Adjustments for 404 */
        @media (max-width: 768px) {
            .error-header {
                padding: 20px 24px;
            }
            .error-code {
                font-size: 5.5rem;
            }
            .error-title {
                font-size: 1.15rem;
                letter-spacing: 2px;
            }
            .gold-box-404 {
                width: 260px;
                height: 260px;
                margin: 5px auto 15px auto;
            }
            .btn-back-home {
                height: 44px !important;
                padding: 0 25px !important;
            }
        }
    </style>
</head>

    <!-- Self-contained interactive 3D coins parallax script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const goldBox = document.querySelector('.gold-box-404');
            const base = document.querySelector('.asset-base');
            const overlay = document.querySelector('.asset-overlay');

            if (goldBox && base && overlay) {
                let mouseX = 0, mouseY = 0;
                let targetX = 0, targetY = 0;

                window.addEventListener('mousemove', (e) => {
                    const rect = goldBox.getBoundingClientRect();
                    const boxCenterX = rect.left + rect.width / 2;
                    const boxCenterY = rect.top + rect.height / 2;

                    // Calculate offset from center of gold box (-1 to 1)
                    targetX = (e.clientX - boxCenterX) / (window.innerWidth / 2);
                    targetY = (e.clientY - boxCenterY) / (window.innerHeight / 2);
                });

                // Touch support for mobiles
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        const rect = goldBox.getBoundingClientRect();
                        const boxCenterX = rect.left + rect.width / 2;
                        const boxCenterY = rect.top + rect.height / 2;

                        targetX = (e.touches[0].clientX - boxCenterX) / (window.innerWidth / 2);
                        targetY = (e.touches[0].clientY - boxCenterY) / (window.innerHeight / 2);
                    }
                }, { passive: true });

                // Smooth interpolation loop (60fps) for premium physical glide
                function updateFloating() {
                    mouseX += (targetX - mouseX) * 0.08;
                    mouseY += (targetY - mouseY) * 0.08;

                    // Parallax displacement
                    base.style.transform = `translate3d(${mouseX * 15}px, ${mouseY * 15}px, 0) rotate(${mouseX * 2}deg)`;
                    overlay.style.transform = `translate3d(${mouseX * 30}px, ${mouseY * 30}px, 0) rotate(${mouseX * -3}deg) scale(1.02)`;

                    requestAnimationFrame(updateFloating);
                }
                updateFloating();
            }
        });
    </script>
