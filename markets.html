<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brokex Markets | Premium Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-light: #0d0d0d;
            --bg-subtle: #141414;
            --gold: #b89566;
            --gold-bright: #d4af37;
            --gold-deep: #b89566;
            --text-dark: #f5f5f5;
            --text-grey: #888888;
            --grid-color: rgba(255, 255, 255, 0.15);
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Source Code Pro', monospace;
            --up-color: #3b82f6;
            --down-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* Global Grid Lines - reaching all edges */
        .grid-line {
            position: absolute;
            z-index: 20;
            pointer-events: none;
        }

        .grid-line.horizontal {
            height: 1px;
            left: 0;
            right: 0;
            border-top: 1px dashed var(--grid-color);
        }

        .grid-line.horizontal.top {
            top: 50px;
        }

        .grid-line.horizontal.bottom {
            bottom: 50px;
        }

        .grid-line.horizontal.sidebar-header-bottom {
            top: 110px;
            width: 310px;
            left: 50px;
        }

        .grid-line.horizontal.content-header-bottom {
            top: 190px;
            left: 360px;
            right: 50px;
        }

        .grid-line.vertical {
            width: 1px;
            top: 0;
            bottom: 0;
            border-left: 1px dashed var(--grid-color);
        }

        .grid-line.vertical.left {
            left: 50px;
        }

        .grid-line.vertical.right {
            right: 50px;
        }

        .grid-line.vertical.divider {
            left: 360px;
        }

        /* Layout */
        .app-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 310px;
            margin-left: 50px;
            margin-top: 50px;
            margin-bottom: 50px;
            height: calc(100% - 100px);
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
            z-index: 5;
            /* No border here, handled by grid-line */
        }

        .main-content {
            flex: 1;
            margin-right: 50px;
            margin-top: 50px;
            margin-bottom: 50px;
            height: calc(100% - 100px);
            display: flex;
            flex-direction: column;
            z-index: 5;
            background: var(--bg-light);
        }

        /* Top Nav spanning the whole top grid line area */
        .top-nav {
            position: absolute;
            top: 0;
            left: 50px;
            right: 50px;
            height: 50px;
            display: flex;
            z-index: 30;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav-left {
            width: 310px;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .top-nav-left svg {
            height: 20px;
            width: auto;
        }

        .top-nav-right {
            display: flex;
            height: 100%;
        }

        .top-nav-right a,
        .top-nav-right button {
            height: 100%;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-grey);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            background: transparent;
            border: none;
            cursor: pointer;
            border-left: 1px dashed var(--grid-color);
        }

        .top-nav-right a {
            padding: 0 30px;
        }

        .top-nav-right button {
            width: 50px;
            justify-content: center;
            padding: 0;
            color: var(--text-dark);
        }

        .top-nav-right a:hover,
        .top-nav-right button:hover {
            color: var(--gold);
            background: var(--bg-subtle);
        }

        .theme-toggle .sun-icon,
        .theme-toggle .moon-icon {
            width: 18px;
            height: 18px;
            display: none;
        }

        [data-theme="light"] .moon-icon {
            display: block;
        }

        [data-theme="dark"] .sun-icon {
            display: block;
        }

        .sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-grey);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .asset-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .asset-list::-webkit-scrollbar {
            display: none;
        }

        .asset-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--grid-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .asset-item:hover {
            background: var(--bg-subtle);
        }

        .asset-item.active {
            border-left: 3px solid var(--gold);
            background: var(--bg-subtle);
            padding-left: 17px;
        }

        .asset-item .name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .asset-item .symbol {
            font-size: 9px;
            color: var(--text-grey);
            font-weight: 500;
        }

        .asset-item .price {
            font-size: 11px;
            font-weight: 700;
            text-align: right;
        }

        .asset-item .change {
            font-size: 9px;
            text-align: right;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 3px;
            justify-content: flex-end;
        }

        .text-up {
            color: var(--up-color);
        }

        .text-down {
            color: var(--down-color);
        }

        .content-header {
            height: 140px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .asset-info h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .symbol-badge {
            font-size: 12px;
            color: var(--text-grey);
            background: var(--bg-subtle);
            border: 1px solid var(--grid-color);
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .main-price-row {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .main-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .main-change-badge {
            font-size: 12px;
            font-weight: 700;
            color: white;
            background: var(--up-color);
            padding: 2px 8px;
            border-radius: 40px;
        }

        .main-change-badge.down {
            background: var(--down-color);
        }

        .trade-btn {
            border: 1px solid var(--grid-color);
            padding: 12px 25px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dark);
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .trade-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--bg-subtle);
        }

        .chart-wrapper {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #tv-chart {
            width: 100%;
            height: 100%;
        }

        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-light);
            z-index: 10;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid var(--grid-color);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            text-align: center;
            color: var(--down-color);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .retry-btn {
            margin-top: 10px;
            padding: 5px 15px;
            background: var(--gold);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .logo-text {
            fill: var(--text-dark) !important;
        }

        .logo-accent {
            fill: var(--gold) !important;
        }

        .copyright-grid {
            position: absolute;
            bottom: 0;
            left: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-grey);
            font-weight: 500;
            letter-spacing: 1px;
            z-index: 20;
        }

        .social-grid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 50px;
            height: 50px;
            display: flex;
            justify-content: flex-end;
            z-index: 20;
        }

        .social-grid a {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-left: 1px dashed var(--grid-color);
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .social-grid a:hover {
            background: var(--bg-subtle);
            color: var(--gold);
        }
    </style>
</head>

    <script>
        const STREAM_URL = "https://benchmarks.pyth.network/v1/shims/tradingview/streaming";
        const DIFF_URL = "https://benchmarks.pyth.network/v1/price_differences/";

        const ASSET_DETAILS = {
            "BTC": { name: "Bitcoin", id: "Crypto.BTC/USD" },
            "ETH": { name: "Ethereum", id: "Crypto.ETH/USD" },
            "SOL": { name: "Solana", id: "Crypto.SOL/USD" },
            "BNB": { name: "Binance Coin", id: "Crypto.BNB/USD" },
            "XRP": { name: "XRP", id: "Crypto.XRP/USD" },
            "ADA": { name: "Cardano", id: "Crypto.ADA/USD" },
            "LINK": { name: "Chainlink", id: "Crypto.LINK/USD" },
            "AAPL": { name: "Apple Inc.", id: "Equity.US.AAPL/USD" },
            "NVDA": { name: "NVIDIA Corp.", id: "Equity.US.NVDA/USD" },
            "MSFT": { name: "Microsoft", id: "Equity.US.MSFT/USD" },
            "GOOG": { name: "Alphabet Inc.", id: "Equity.US.GOOGL/USD" },
            "AMZN": { name: "Amazon", id: "Equity.US.AMZN/USD" },
            "META": { name: "Meta Platforms", id: "Equity.US.META/USD" },
            "TSLA": { name: "Tesla Inc.", id: "Equity.US.TSLA/USD" },
            "AMD": { name: "Advanced Micro Devices", id: "Equity.US.AMD/USD" },
            "NFLX": { name: "Netflix Inc.", id: "Equity.US.NFLX/USD" },
            "PLTR": { name: "Palantir Tech", id: "Equity.US.PLTR/USD" },
            "ORCL": { name: "Oracle Corp.", id: "Equity.US.ORCL/USD" },
            "COST": { name: "Costco Wholesale", id: "Equity.US.COST/USD" },
            "INTC": { name: "Intel Corp.", id: "Equity.US.INTC/USD" },
            "TSM": { name: "TSMC", id: "Equity.US.TSM/USD" },
            "ASML": { name: "ASML Holding", id: "Equity.US.ASML/USD" },
            "AVGO": { name: "Broadcom Inc.", id: "Equity.US.AVGO/USD" },
            "EUR": { name: "Euro / USD", id: "FX.EUR/USD" },
            "GBP": { name: "Pound / USD", id: "FX.GBP/USD" },
            "AUD": { name: "AUD / USD", id: "FX.AUD/USD" },
            "XAU": { name: "Gold Spot", id: "Metal.XAU/USD" },
            "XAG": { name: "Silver Spot", id: "Metal.XAG/USD" },
            "XPT": { name: "Platinum Spot", id: "Metal.XPT/USD" },
            "BRENT": { name: "Brent Crude", id: "Commodities.WTIM6/USD" }
        };

        const ID_MAP = {};
        Object.entries(ASSET_DETAILS).forEach(([symbol, data]) => ID_MAP[data.id] = symbol);

        const assetList = document.getElementById('asset-list');
        const assetPrices = new Map();
        let chart = null;
        let candleSeries = null;
        let selectedSymbol = "BTC";

        function formatPrice(p) {
            if (p >= 1000) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            if (p >= 1) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            return p.toLocaleString('en-US', { minimumFractionDigits: 5, maximumFractionDigits: 7 });
        }

        async function initMarkets() {
            let differences = [];
            try {
                const res = await fetch(DIFF_URL);
                if (res.ok) differences = await res.json();
            } catch (e) { }

            Object.keys(ASSET_DETAILS).forEach(symbol => {
                const data = ASSET_DETAILS[symbol];
                const diffData = differences.find(d => d.symbol === data.id);
                const dayDiff = diffData ? diffData.day_price_diff_decimal : 0;
                const diffClass = dayDiff >= 0 ? 'text-up' : 'text-down';
                const sign = dayDiff >= 0 ? '+' : '';

                const item = document.createElement('div');
                item.id = `item-${symbol}`;
                item.className = 'asset-item';
                item.onclick = () => selectAsset(symbol);
                item.innerHTML = `
                    <div class="flex flex-col">
                        <span class="name">${data.name}</span>
                        <span class="symbol">${symbol}/USD</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="price mono">$ --.--</span>
                        <span class="change mono ${diffClass}">
                            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="${dayDiff >= 0 ? 'M7 17l9.2-9.2M17 17V7H7' : 'M7 7l9.2 9.2M7 17h10V7'}"/></svg>
                            ${sign}${(dayDiff * 100).toFixed(2)}%
                        </span>
                    </div>
                `;
                assetList.appendChild(item);
            });
            selectAsset(selectedSymbol);
            startStreaming();
        }

        function selectAsset(symbol) {
            selectedSymbol = symbol;
            const data = ASSET_DETAILS[symbol];
            document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`item-${symbol}`)?.classList.add('active');
            document.getElementById('main-name').textContent = data.name;
            document.getElementById('main-symbol-badge').textContent = `${symbol}/USD`;
            loadChart(symbol);
        }

        async function loadChart(symbol) {
            const loader = document.getElementById('loader');
            const loaderContent = document.getElementById('loader-content');
            const container = document.getElementById('tv-chart');

            try {
                const assetData = ASSET_DETAILS[symbol];
                if (!assetData) throw new Error(`Asset ${symbol} not found`);

                const fullId = assetData.id;
                console.log("Initializing chart for:", fullId);

                loader.style.display = 'flex';
                loaderContent.innerHTML = `<div class="spinner"></div><span class="mono text-[10px] uppercase mt-4 opacity-50">Syncing Market Data</span>`;

                if (typeof LightweightCharts === 'undefined') {
                    throw new Error("Charting library not loaded. Please check your internet connection.");
                }

                if (chart) {
                    chart.remove();
                    chart = null;
                }

                const themeColors = {
                    bg: '#0d0d0d', text: '#888888', grid: 'rgba(255, 255, 255, 0.03)',
                };

                chart = LightweightCharts.createChart(container, {
                    layout: { background: { color: 'transparent' }, textColor: themeColors.text, fontFamily: 'Inter, sans-serif' },
                    grid: { vertLines: { color: themeColors.grid }, horzLines: { color: themeColors.grid } },
                    timeScale: { borderColor: 'transparent', timeVisible: true, secondsVisible: false },
                    rightPriceScale: { borderColor: 'transparent' },
                    handleScroll: { mouseWheel: true, pressedMouseMove: true },
                    handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
                });

                candleSeries = chart.addCandlestickSeries({
                    upColor: '#3b82f6', downColor: '#ef4444', borderVisible: false,
                    wickUpColor: '#3b82f6', wickDownColor: '#ef4444',
                });

                // Fetch 1 month of history
                const to = Math.floor(Date.now() / 1000);
                const from = to - (60 * 60 * 24 * 30);
                const url = `https://benchmarks.pyth.network/v1/shims/tradingview/history?symbol=${encodeURIComponent(fullId)}&resolution=60&from=${from}&to=${to}`;

                console.log("Fetching history:", url);

                // Add a timeout to the fetch
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                const d = await response.json();

                if (d.s === "error") throw new Error(d.errmsg || "API Error");
                if (d.s === "no_data" || !d.t || d.t.length === 0) throw new Error("No data available for this range");

                const formattedData = d.t.map((time, i) => ({
                    time: time,
                    open: d.o[i], high: d.h[i], low: d.l[i], close: d.c[i]
                }));

                candleSeries.setData(formattedData);
                chart.timeScale().fitContent();
                loader.style.display = 'none';
            } catch (err) {
                console.error("Chart Error:", err);
                loader.style.display = 'flex';
                loaderContent.innerHTML = `
                    <div class="error-message">CONNECTION ERROR</div>
                    <div class="text-[10px] opacity-50 mt-2 mb-4 mono uppercase text-center px-10">${err.name === 'AbortError' ? 'Request timed out' : err.message}</div>
                    <button class="retry-btn" onclick="loadChart('${symbol}')">RETRY SYNC</button>
                `;
            }
        }

        function updateUI(data) {
            const symbol = ID_MAP[data.id.replace('.POST', '').replace('.PRE', '')];
            if (!symbol) return;
            const { p } = data;
            assetPrices.set(symbol, { price: p });
            const item = document.getElementById(`item-${symbol}`);
            if (item) item.querySelector('.price').textContent = `$ ${formatPrice(p)}`;
            if (symbol === selectedSymbol) document.getElementById('main-price').textContent = `$ ${formatPrice(p)}`;
        }

        async function startStreaming() {
            try {
                const response = await fetch(STREAM_URL);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    for (const line of lines) if (line.trim()) try { updateUI(JSON.parse(line)); } catch (e) { }
                }
            } catch (err) { setTimeout(startStreaming, 3000); }
        }

        window.addEventListener('resize', () => {
            const container = document.getElementById('tv-chart');
            if (chart && container) {
                chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            }
        });

        initMarkets();
    </script>
</body>

</html>
